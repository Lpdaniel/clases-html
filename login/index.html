<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKOON LOGIN</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="tarjeta">
        <header>
            <p class="logo">🔐IKOON</p>
            <h1>Iniciar sesión</h1>
        </header>

        <form class="formulario" action="#">
            <div class="campo">
                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" placeholder="tu@correo.com"
                        required autocomplete="email">
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña</label>
                <div class="caja-contrasena">
                <input type="password" id="contrasena" name="contrasena"
                        required minlength="8" autocomplete="current-password">
                <button type="button" id="btn_ojo" aria-label="Mostrar contraseña">
                    <img src="img/ojo_cls.png" id="img-ojo">
                </button>
                </div>
            </div>
        

            <div class="opciones">
                <label>
                    <input type="checkbox" name="recordarme"> recordarme
                </label>
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
            <div class="botones">
            <button type="submit" id="btn_entrar">Entrar</button>
            <a href="register.html" id="btn_registrar">Registrar</a>
            </div>
                
                
        </form>
    </main>    
    <script src="script.js"></script>
</body>
</html>
