<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKOON REGISTRER</title>
    <link rel="stylesheet" href="estilosrg.css">
</head>
<body>
    <main class="tarjeta">
        <header>
            <p class="logo">IKOON Registrer</p>
            <h1>Registrarse</h1>
        </header>
        <form class="formulario" action="#">
            <div class="campo">
                <label for="correo">Correo:</label>
                <input type="correo" id="correo" name="correo" placeholder="tu@correo.com"
                        required autocomplete="email">
            </div>
            <div class="campo">
                <label for="contrasena">Contraseña:</label>
                <input type="password">

            </div>






        </form>





    </main>
    
</body>
</html>
